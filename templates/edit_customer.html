<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Customer - {{ shop_name }}</title>
<style>
  :root {
    --navy: #14324f; --teal: #0d9488; --teal-light: #14b8a6; --bg: #f3f6f9; --card: #ffffff;
    --text: #1f2937; --muted: #6b7280; --border: #e2e8f0; --error: #dc2626; --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .navbar { background: var(--navy); color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .navbar .brand { font-size: 19px; font-weight: 700; }
  .navbar a { color: white; text-decoration: none; font-size: 14px; padding: 8px 14px; border-radius: 6px; }
  .container { max-width: 520px; margin: 0 auto; padding: 24px; }
  .back-link { display: inline-block; margin-bottom: 16px; color: var(--navy); text-decoration: none; font-size: 14px; }
  .card { background: var(--card); border-radius: 12px; padding: 28px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .card h2 { margin: 0 0 20px; color: var(--navy); font-size: 20px; }
  .flash-message { padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; }
  .flash-message.error { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
  .flash-message.success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; margin-top: 14px; }
  input, textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; }
  input:focus, textarea:focus { outline: none; border-color: var(--teal); }
  button { margin-top: 22px; padding: 12px 24px; background: var(--teal); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: var(--teal-light); }
  .delete-form { margin-top: 12px; }
  .delete-btn { background: var(--error); }
  .delete-btn:hover { background: #b91c1c; }
</style>
</head>
<body>
  <div class="navbar">
    <div class="brand">👓 {{ shop_name }}</div>
    <a href="{{ url_for('home') }}">← Dashboard</a>
  </div>
  <div class="container">
    <a class="back-link" href="{{ url_for('customer_detail', customer_id=customer.id) }}">← Customer detail</a>
    <div class="card">
      <h2>✏️ Edit Customer</h2>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash-message {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required value="{{ customer.name }}">
        <label for="mobile">Mobile Number</label>
        <input type="text" id="mobile" name="mobile" maxlength="15" value="{{ customer.mobile or '' }}">
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3">{{ customer.address or '' }}</textarea>
        <button type="submit">Update Customer</button>
      </form>
      <form class="delete-form" method="POST" action="{{ url_for('delete_customer', customer_id=customer.id) }}"
            onsubmit="return confirm('Kya aap sach mein is customer ko delete karna chahte hain?');">
        <button type="submit" class="delete-btn">🗑️ Delete Customer</button>
      </form>
    </div>
  </div>
</body>
</html>
